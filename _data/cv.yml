    Projects:
      - name: VLM-Based Assistive Smart Glasses for the Visually Impaired
        summary: Led the development of assistive smart glasses that capture images, communicate with a server, and return VLM-generated responses to visually impaired users in real time.
        highlights:
          - Developed a server-side VLM inference pipeline using the Gemini API.
          - Integrated image capture, device-server communication, and VLM inference into an end-to-end working prototype.
        start_date: 2025-12
        end_date: 2025-12

      - name: Global Macroeconomic-Conditioned Multi-Stock Price Forecasting
        summary: Developed a multi-stock forecasting approach conditioned on global macroeconomic indicators.
        highlights:
          - Integrated FiLM-based global conditioning with stock-wise self-attention.
          - Studied sensitivity to attention configurations, model dimensions, input window sizes, and prediction horizons.
        start_date: 2025-12
        end_date: 2025-12

      - name: Kookmin University Autonomous Driving Competition
        summary: Led development of a ROS2-based autonomous-driving framework combining camera and LiDAR perception with vehicle control.
        highlights:
          - Built a classical vision lane-following pipeline with Hough-transform-based lane detection.
          - Combined YOLO-based obstacle and vehicle detection with LiDAR-based inter-vehicle distance estimation for safe lane changes.
        start_date: 2025-06
        end_date: 2025-06

